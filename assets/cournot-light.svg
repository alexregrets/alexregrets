<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Cournot best-response diagram: two firms keep best-responding to each other and the path converges to the Nash equilibrium">
  <style>
    .ink    { stroke: #1f2328; }
    .muted  { stroke: #d1d9e0; }
    .accent { stroke: #b7791f; }
    .t   { fill: #1f2328; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .tb  { fill: #1f2328; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 600; }
    .tm  { fill: #59636e; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .ta  { fill: #b7791f; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .dot { fill: #b7791f; }

    .br { stroke-width: 1.6; fill: none; stroke-linecap: round;
          stroke-dasharray: 620; stroke-dashoffset: 620;
          animation: draw 1.5s cubic-bezier(.4,0,.2,1) forwards; }
    .br2 { animation-delay: .35s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .path { fill: none; stroke: #0969da; stroke-width: 1.3; stroke-linejoin: round;
            stroke-dasharray: 303; stroke-dashoffset: 303;
            animation: walk 9s ease-in-out 1.9s infinite; }
    @keyframes walk {
      0%   { stroke-dashoffset: 303; opacity: 1; }
      45%  { stroke-dashoffset: 0;   opacity: 1; }
      85%  { stroke-dashoffset: 0;   opacity: 1; }
      100% { stroke-dashoffset: 0;   opacity: 0; }
    }
    .node { fill: #0969da; opacity: 0; animation: blink0 9s linear 1.9s infinite; }
    .n0 { animation-name: blink0; }@keyframes blink0 { 0%, 0.0% { opacity: 0; } 2.0%, 85% { opacity: .9; } 100% { opacity: 0; } } .n1 { animation-name: blink1; }@keyframes blink1 { 0%, 14.8% { opacity: 0; } 16.8%, 85% { opacity: .9; } 100% { opacity: 0; } } .n2 { animation-name: blink2; }@keyframes blink2 { 0%, 33.8% { opacity: 0; } 35.8%, 85% { opacity: .9; } 100% { opacity: 0; } } .n3 { animation-name: blink3; }@keyframes blink3 { 0%, 37.5% { opacity: 0; } 39.5%, 85% { opacity: .9; } 100% { opacity: 0; } } .n4 { animation-name: blink4; }@keyframes blink4 { 0%, 42.2% { opacity: 0; } 44.2%, 85% { opacity: .9; } 100% { opacity: 0; } } .n5 { animation-name: blink5; }@keyframes blink5 { 0%, 43.1% { opacity: 0; } 45.1%, 85% { opacity: .9; } 100% { opacity: 0; } } .n6 { animation-name: blink6; }@keyframes blink6 { 0%, 44.3% { opacity: 0; } 46.3%, 85% { opacity: .9; } 100% { opacity: 0; } } .n7 { animation-name: blink7; }@keyframes blink7 { 0%, 44.5% { opacity: 0; } 46.5%, 85% { opacity: .9; } 100% { opacity: 0; } }

    .pop { opacity: 0; animation: pop .5s ease-out 1.7s forwards; }
    @keyframes pop { to { opacity: 1; } }

    .pulse { animation: pulse 3.5s ease-in-out 2.2s infinite; }
    @keyframes pulse { 0%,100% { r: 5; } 50% { r: 7.5; } }

    @media (prefers-reduced-motion: reduce) { .br { animation: none; stroke-dashoffset: 0; } .path { animation: none; stroke-dashoffset: 0; } .node { animation: none; opacity: .9; } .pop { animation: none; opacity: 1; } .pulse { animation: none; } }
  </style>

  <g class="muted pop" stroke-width="1" stroke-dasharray="3 4">
    <line x1="70" y1="180" x2="250" y2="180"/>
    <line x1="250" y1="250" x2="250" y2="180"/>
  </g>

  <g class="ink" stroke-width="1.4" stroke-linecap="round">
    <line x1="70" y1="250" x2="618" y2="250"/>
    <line x1="70" y1="250" x2="70" y2="34"/>
  </g>

  <line class="br accent" x1="340" y1="250" x2="70"  y2="40"/>
  <line class="br br2 accent" x1="70"  y1="145" x2="610" y2="250" opacity=".55"/>

  <path class="path" d="M90.6,56.0 L90.6,149.0 L210.1,149.0 L210.1,172.2 L240.0,172.2 L240.0,178.1 L247.5,178.1 L247.5,179.5 L249.4,179.5 L249.4,179.9 L249.8,179.9 L249.8,180.0 L250.0,180.0"/>
  <circle class="node n0" cx="90.6" cy="56.0" r="2.6"/><circle class="node n1" cx="90.6" cy="149.0" r="2.6"/><circle class="node n2" cx="210.1" cy="149.0" r="2.6"/><circle class="node n3" cx="210.1" cy="172.2" r="2.6"/><circle class="node n4" cx="240.0" cy="172.2" r="2.6"/><circle class="node n5" cx="240.0" cy="178.1" r="2.6"/><circle class="node n6" cx="247.5" cy="178.1" r="2.6"/><circle class="node n7" cx="247.5" cy="179.5" r="2.6"/>

  <g class="pop">
    <circle class="dot pulse" cx="250" cy="180" r="5"/>
  </g>

  <text class="tm" x="60"  y="268" text-anchor="middle">0</text>
  <text class="t"  x="628" y="255">q₁</text>
  <text class="t"  x="62"  y="28"  text-anchor="middle">q₂</text>

  <text class="tm" x="352" y="222" transform="rotate(-38 352 222)">BR₁(q₂)</text>
  <text class="tm" x="470" y="228">BR₂(q₁)</text>

  <g class="pop">
    <text class="ta" x="264" y="172">Nash</text>
    <text class="tm" x="264" y="188">q* = (a − c) / 3b</text>
  </g>

  <text class="tb" x="440" y="70">Alexander Sotnik</text>
  <text class="tm" x="440" y="92">economics × agents</text>
  <text class="t"  x="440" y="128">two firms best-respond</text>
  <text class="t"  x="440" y="146">until nobody moves.</text>
  <text class="tm" x="440" y="172">swap the students for LLMs:</text>
  <text class="ta" x="440" y="190">Nash, collusion, or Berge?</text>
</svg>

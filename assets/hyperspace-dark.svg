<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 120" width="380" height="120" role="img" aria-label="An X-wing flies through a parallax starfield and fires laser volleys">
  <style>
    .bg { fill: #161b22; stroke: #30363d; }
    .stars circle { fill: #e6edf3; }
    @keyframes drift { to { transform: translateX(-380px); } }
    .s0 { animation: drift 18s linear infinite; } .s1 { animation: drift 10s linear infinite; } .s2 { animation: drift 5s linear infinite; }
    .hull { fill: #e6edf3; }
    .cockpit { fill: #58a6ff; }
    .engine { fill: #ff8a3d; animation: glow .4s ease-in-out infinite alternate; }
    @keyframes glow { to { opacity: .45; } }
    .bob { animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-4px); } }
    .laser { stroke: #ff4d4d; stroke-width: 2; stroke-linecap: round; opacity: 0;
             animation: shoot 2.4s linear infinite; }
    .l2 { animation-delay: .18s; }
    @keyframes shoot {
      0%   { transform: translateX(0);     opacity: 1; }
      30%  { transform: translateX(220px); opacity: 1; }
      31%, 100% { opacity: 0; }
    }
    .cap { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #8b949e; }
    @media (prefers-reduced-motion: reduce) { g[class^=s], .bob, .engine { animation: none; } .laser { animation: none; } }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="379" height="119" rx="8"/>

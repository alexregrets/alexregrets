    <g class="hull">
      <path d="M24 58 L44 52 L118 55 L136 60 L118 65 L44 68 L24 62 Z"/>
      <path class="cockpit" d="M66 55 L84 53.5 L92 56 L66 57 Z"/>
      <path d="M40 54 L58 34 L66 34 L58 54 Z"/>
